<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba multijugador</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      cursor: pointer;
    }

    input {
      padding: 12px;
      width: 150px;
    }

    #status {
      margin: 20px 0;
      font-weight: bold;
    }

    #roomCode {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    #gamePanel {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #999;
    }
  </style>
</head>

<body>

  <h1>Prueba multijugador</h1>

  <div id="status">
    Conectando...
  </div>

  <button id="createButton">
    Crear sala
  </button>

  <hr>

  <input
    id="roomInput"
    type="text"
    maxlength="4"
    placeholder="Código"
  >

  <button id="joinButton">
    Unirse
  </button>

  <p>
    Código de sala:
    <span id="roomCode">---</span>
  </p>

  <p>
    Jugadores conectados:
    <strong id="playerCount">0</strong>
  </p>

  <div id="gamePanel">

    <h2>Estado de la partida</h2>

    <p>
      Estado:
      <strong id="gameStatus">Esperando</strong>
    </p>

    <p>
      Acertijo:
      <strong id="currentPuzzle">0</strong>
    </p>

    <p>
      Progreso:
      <strong id="puzzleProgress">0/5</strong>
    </p>

    <p>
      Tiempo:
      <strong id="timeRemaining">10:00</strong>
    </p>

    <button id="startButton">
      Iniciar partida
    </button>

    <button id="solveButton">
      Simular acertijo resuelto
    </button>

  </div>


  <script>

    const socket = io(
      "https://fermat-multiplayer.onrender.com"
    );


    const statusEl =
      document.getElementById("status");

    const createButton =
      document.getElementById("createButton");

    const joinButton =
      document.getElementById("joinButton");

    const roomInput =
      document.getElementById("roomInput");

    const roomCodeEl =
      document.getElementById("roomCode");

    const playerCountEl =
      document.getElementById("playerCount");

    const gameStatusEl =
      document.getElementById("gameStatus");

    const currentPuzzleEl =
      document.getElementById("currentPuzzle");

    const puzzleProgressEl =
      document.getElementById("puzzleProgress");

    const timeRemainingEl =
      document.getElementById("timeRemaining");

    const startButton =
      document.getElementById("startButton");

    const solveButton =
      document.getElementById("solveButton");


    let isRoomCreator = false;


    socket.on("connect", () => {

      statusEl.textContent =
        "Conectado al servidor";

    });


    socket.on("connect_error", () => {

      statusEl.textContent =
        "Error de conexión";

    });


    createButton.addEventListener(
      "click",
      () => {

        socket.emit("createRoom");

      }
    );


    joinButton.addEventListener(
      "click",
      () => {

        const code =
          roomInput.value
            .trim()
            .toUpperCase();

        if (!code) {
          return;
        }

        socket.emit(
          "joinRoom",
          code
        );

      }
    );


    startButton.addEventListener(
      "click",
      () => {

        socket.emit("startGame");

      }
    );


    solveButton.addEventListener(
      "click",
      () => {

        socket.emit("puzzleSolved");

      }
    );


    socket.on(
      "roomCreated",
      (data) => {

        roomCodeEl.textContent =
          data.roomCode;

        isRoomCreator = true;

        statusEl.textContent =
          "Sala creada";

      }
    );


    socket.on(
      "playersUpdated",
      (data) => {

        playerCountEl.textContent =
          data.players;

      }
    );


    socket.on(
      "roomState",
      (state) => {

        gameStatusEl.textContent =
          state.status;

        currentPuzzleEl.textContent =
          state.currentPuzzle;

        puzzleProgressEl.textContent =
          `${state.puzzlesSolved}/${state.totalPuzzles}`;

        const minutes =
          Math.floor(
            state.timeRemaining / 60
          );

        const seconds =
          state.timeRemaining % 60;

        timeRemainingEl.textContent =
          `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

        playerCountEl.textContent =
          state.players;


        if (
          state.status === "playing"
        ) {

          startButton.disabled =
            true;

        }


        if (
          state.status === "victory"
        ) {

          solveButton.disabled =
            true;

          startButton.disabled =
            true;

        }

      }
    );


    socket.on(
      "roomError",
      (message) => {

        statusEl.textContent =
          message;

      }
    );

  </script>

</body>
</html>
